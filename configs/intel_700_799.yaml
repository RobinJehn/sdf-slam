# Dissertation experiment 4.2.2: incremental optimization on Intel scans
# 700-799 with Eikonal weight 0.2.
dataset_dir: data/intel_700_799
output_dir: out/intel_700_799
mode: incremental
increment_size: 1
iterations_per_increment: 10
active_region: true
active_margin: 2
map:
  nx: 100
  ny: 100
  auto_domain: true
  auto_domain_margin: 15.0
weights:
  scan: 1.0
  hallucination: 1.0
  eikonal: 0.2
  odometry: 1.0
hallucination:
  points_per_scan_point: 6
  step_size: 0.1
normals:
  method: hybrid
  k_neighbors: 10
solver:
  backend: lm
  lambda_init: 1.0
  lambda_factor: 1.0
