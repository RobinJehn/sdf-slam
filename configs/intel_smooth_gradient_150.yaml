# Full Intel at 150x150 (0.36 m cells): the anchored reference config of
# the DEC-0007 recipe. Default smooth-gradient stencil, eikonal area-scaled
# per DEC-0009. ICP-relations median 0.052-0.062 m across ten certified
# runs. CHOLMOD is the reference linear solver (DEC-0008 reordering tier,
# certified 2026-09-14: lap-1 ensemble 8/8 spread 0.000, three jittered
# full runs at 0.053-0.055 m, healthy maps); it also matches the original
# dissertation repo's solver. ~17-18 min at 5 iterations per increment.
dataset_dir: data/intel
output_dir: out/intel_smooth_gradient_150
mode: incremental
increment_size: 1
iterations_per_increment: 5
snapshot_every: 0
active_region: false
smooth_gradient: true
map:
  nx: 150
  ny: 150
  auto_domain: false
  min: [-15.0, -28.0]
  max: [38.0, 25.0]
weights:
  scan: 1.0
  hallucination: 1.0
  eikonal: 0.018
  odometry: 1.0
hallucination:
  points_per_scan_point: 6
  step_size: 0.1
normals:
  method: pca
  k_neighbors: 7
solver:
  backend: lm
  linear_solver: cholmod
  lambda_init: 5.0
  lambda_factor: 0.9
  step_tolerance: 0.001
