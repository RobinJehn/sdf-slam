# Dissertation experiment 4.2.3: incremental optimization over the full Intel
# dataset, Eikonal weight 0.2, 10 iterations per new scan.
dataset_dir: data/intel
output_dir: out/intel_incremental
mode: incremental
increment_size: 1
iterations_per_increment: 10
active_region: true
active_margin: 2
map:
  nx: 100
  ny: 100
  # auto_domain derives the bounds from the odometry-transformed scan points.
  # Intel odometry drifts ~40 m, so the domain grows to ~96x109 m (~1 m cells)
  # while the optimized trajectory covers only ~45x40 m in its top-right
  # corner. For a tighter map at the same node count, set auto_domain: false
  # with min: [-15.0, -28.0] and max: [38.0, 25.0].
  auto_domain: true
  auto_domain_margin: 15.0
weights:
  scan: 1.0
  hallucination: 1.0
  eikonal: 0.2
  odometry: 1.0
hallucination:
  points_per_scan_point: 6
  step_size: 0.1
normals:
  method: weighted
  k_neighbors: 10
solver:
  backend: lm
  lambda_init: 1.0
  lambda_factor: 1.0
