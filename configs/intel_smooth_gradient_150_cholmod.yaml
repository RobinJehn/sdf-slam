# Full Intel at 150x150 with the CHOLMOD supernodal solver: the certified
# fast variant of the reference (DEC-0008 reordering tier). Certified per
# DEC-0009 on 2026-09-14: lap-1 ensemble 8/8 with spread 0.000, three
# lambda-jittered full runs at ICP-relations median 0.053-0.055 m (reference
# band 0.052-0.062), healthy maps. ~17-18 min instead of ~34: CHOLMOD
# removes the serial LDLT elimination-tree trunk.
# Certification binds to the (binary, config) pair — a solver or config
# change repeats the DEC-0009 gate.
dataset_dir: data/intel
output_dir: out/intel_smooth_gradient_150_cholmod
mode: incremental
increment_size: 1
iterations_per_increment: 5
snapshot_every: 0
active_region: false
smooth_gradient: true
map:
  nx: 150
  ny: 150
  auto_domain: false
  min: [-15.0, -28.0]
  max: [38.0, 25.0]
weights:
  scan: 1.0
  hallucination: 1.0
  eikonal: 0.018
  odometry: 1.0
hallucination:
  points_per_scan_point: 6
  step_size: 0.1
normals:
  method: pca
  k_neighbors: 7
solver:
  backend: lm
  linear_solver: cholmod
  lambda_init: 5.0
  lambda_factor: 0.9
  step_tolerance: 0.001
