# Second stage of the two-stage Intel pipeline (DEC-0007): batch polish at
# 200x200 warm-started from the 150x150 reference run's trajectory.
# Jitter-stable to the last digit; with CHOLMOD (certified 2026-09-14,
# three jittered runs identical at 0.053 m median) it runs in ~60 s.
# Requires out/intel_smooth_gradient_150/poses_estimated.csv.
dataset_dir: data/intel
initial_poses: out/intel_smooth_gradient_150/poses_estimated.csv
output_dir: out/intel_polish_200
mode: batch
active_region: false
smooth_gradient: true
map:
  nx: 200
  ny: 200
  auto_domain: false
  min: [-15.0, -28.0]
  max: [38.0, 25.0]
weights:
  scan: 1.0
  hallucination: 1.0
  eikonal: 0.01
  odometry: 1.0
hallucination:
  points_per_scan_point: 6
  step_size: 0.1
normals:
  method: pca
  k_neighbors: 7
solver:
  backend: lm
  linear_solver: cholmod
  lambda_init: 5.0
  lambda_factor: 0.9
  step_tolerance: 0.001
  max_iterations: 100
