name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libeigen3-dev libceres-dev clang-format clang-tidy

      - name: Format check
        run: make format-check

      - name: Build
        run: make build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke run
        run: ./build/run_slam configs/smoke.yaml out/ci-smoke

      - name: clang-tidy
        run: make tidy
